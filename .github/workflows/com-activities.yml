name: COM Activities Update

on:
  schedule:
    # 04:00 KST 게시 목표에 앞서 03:31 KST에 수집 시작
    - cron: "31 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: com-activities-update
  cancel-in-progress: false

jobs:
  update-com-activities:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      COM_MAX_PAGES: "5"
      COM_MAX_SECTIONS_PER_PAGE: "22"
      COM_KEEP_RAW: "true"
      COM_SUMMARY_VERSION: "ministry-activities-5-v1"
      OPENAI_SLEEP_SECONDS: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main before collecting
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate OpenAI API key before collection
        run: python scripts/validate_openai_key.py

      - name: Collect COM activities
        run: python scripts/fetch_com_activities.py

      - name: Sync latest main before commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/com-activities.json data/com-debug.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update COM activities data"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
