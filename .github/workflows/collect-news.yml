name: Collect BNCP News

on:
  schedule:
    # 06:00 and 12:00 Korea Standard Time (UTC+9)
    - cron: "0 21 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-bncp-news
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate OpenAI API key before collection
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/validate_openai_key.py

      - name: Collect and translate news
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SUMMARY_MODEL: ${{ 'gpt-5-mini' }}
          NEWS_LOOKBACK_DAYS: "60"
        run: node scripts/collect-news.mjs

      - name: Commit updated news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No news data changes to commit."
            exit 0
          fi
          git commit -m "Update and translate BNCP news"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
