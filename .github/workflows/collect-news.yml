name: Collect BNCP News

on:
  schedule:
    - cron: "17 2,20 * * *" # 05:17 / 11:17 KST full collection
    - cron: "17 0,1,3-19,21-23 * * *" # hourly domestic + Iraq
  workflow_dispatch:
    inputs:
      mode:
        description: Collection scope
        type: choice
        options: [full, hourly]
        default: full

permissions:
  contents: write

concurrency:
  group: collect-bncp-news
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run collector regression tests
        run: |
          node --check scripts/collect-news.mjs
          node --test tests/news-relevance.test.mjs tests/incremental-news.test.mjs

      - name: Validate OpenAI API key before collection
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/validate_openai_key.py

      - name: Collect and translate news
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          NEWS_COLLECTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '17 2,20 * * *' && 'full' || 'hourly') }}
          NEWS_LOOKBACK_DAYS: "60"
        run: node scripts/collect-news.mjs

      - name: Expand important and cabinet decision summaries
        run: node scripts/ensure-important-summaries.mjs

      - name: Commit updated news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/domestic-news.json data/overseas-news.json data/weekly-context-news.json data/iraq-political-actors.json data/news-index.json data/news-incremental-cache.json
          if git diff --cached --quiet; then
            echo "No news data changes to commit."
            exit 0
          fi
          git commit -m "Update and translate BNCP news"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
